<?xml version="1.0" encoding="UTF-8"?>
<!--
  PLACEHOLDER COVER for "Captain CoverIQ  Issue #1".
  Replace this file with the real cover art (keep the filename `cover.svg`,
  OR drop a `cover.png` and update `coverImage` in src/data/comics.ts).
  Recommended aspect ratio: 2:3 (portrait comic cover), e.g. 1000x1500.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1500" viewBox="0 0 1000 1500" role="img" aria-label="Captain CoverIQ Issue 1 placeholder cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050a16"/>
      <stop offset="0.55" stop-color="#0a1628"/>
      <stop offset="1" stop-color="#030712"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="55%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#14b8a6" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#22d3ee" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1000" height="1500" fill="url(#bg)"/>
  <rect width="1000" height="1500" fill="url(#grid)"/>
  <rect width="1000" height="1500" fill="url(#glow)"/>
  <rect x="24" y="24" width="952" height="1452" rx="28" fill="none" stroke="#22d3ee" stroke-opacity="0.25" stroke-width="2"/>

  <!-- Issue banner -->
  <g font-family="'JetBrains Mono', ui-monospace, monospace">
    <text x="500" y="150" text-anchor="middle" fill="#5eead4" font-size="30" letter-spacing="14" opacity="0.9">COVERIQ COMICS</text>
    <text x="500" y="196" text-anchor="middle" fill="#64748b" font-size="22" letter-spacing="8">ISSUE #1</text>
  </g>

  <!-- Hero emblem: a shield + IQ spark -->
  <g transform="translate(500 640)">
    <path d="M0 -230 L200 -150 L200 40 C200 200 110 300 0 360 C-110 300 -200 200 -200 40 L-200 -150 Z"
          fill="#0c1222" stroke="url(#ink)" stroke-width="8"/>
    <path d="M0 -230 L200 -150 L200 40 C200 200 110 300 0 360 C-110 300 -200 200 -200 40 L-200 -150 Z"
          fill="url(#glow)" opacity="0.5"/>
    <text x="0" y="70" text-anchor="middle" font-family="'Syne', system-ui, sans-serif" font-weight="700"
          font-size="200" fill="url(#ink)">IQ</text>
    <!-- spark -->
    <path d="M40 -120 L20 -40 L70 -40 L-30 110 L0 0 L-50 0 Z" fill="#5eead4" opacity="0.85"/>
  </g>

  <!-- Title -->
  <g font-family="'Syne', system-ui, sans-serif" text-anchor="middle">
    <text x="500" y="1180" fill="#ffffff" font-size="118" font-weight="700" letter-spacing="2">CAPTAIN</text>
    <text x="500" y="1300" fill="url(#ink)" font-size="118" font-weight="700" letter-spacing="2">COVERIQ</text>
  </g>

  <text x="500" y="1400" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace"
        fill="#475569" font-size="24" letter-spacing="4">PLACEHOLDER  DROP REAL cover.svg / cover.png</text>
</svg>
